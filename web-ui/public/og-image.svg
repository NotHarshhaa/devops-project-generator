    <g transform="translate(6, 6) scale(0.68)">
      <path d="M 32 32 C 25 21, 13 21, 13 32 C 13 43, 25 43, 32 32 C 39 21, 51 21, 51 32 C 51 43, 39 43, 32 32 Z" stroke="url(#infinity-grad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="13" cy="32" r="4" fill="#06b6d4"/>
