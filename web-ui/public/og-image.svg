      <stop offset="0%" stopColor="#080c14"/>
      <stop offset="50%" stopColor="#0f172a"/>
      <stop offset="100%" stopColor="#080e1a"/>
    </linearGradient>
    <radialGradient id="glow-cyan" cx="20%" cy="20%" r="40%">
      <stop offset="0%" stopColor="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stopColor="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-indigo" cx="80%" cy="80%" r="50%">
